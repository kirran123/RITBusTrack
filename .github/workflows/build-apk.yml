name: Build Bus Track Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Bus Track)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ztsmxehwjyriyihypppu.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0c214ZWh3anlyaXlpaHlwcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTA4NTMsImV4cCI6MjEwNTQ4Njg1M30.16sn2O8c1HGA6lJTD0TbWYG9lvnHFrhU6-fZXlbmwi4
      CI: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Shared Types Package
        run: npm run build:shared

      - name: Create Mobile Environment Config
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ env.EXPO_PUBLIC_SUPABASE_URL }}" > apps/mobile/.env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> apps/mobile/.env

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile Standalone Bus Track APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK for Download
        run: |
          mkdir -p output-apk
          if [ -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk output-apk/Bus-Track.apk
          elif [ -f apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/Bus-Track.apk
          else
            echo "Searching for any generated APK in build directory..."
            find apps/mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/Bus-Track.apk \;
          fi

      - name: Upload Bus Track Standalone APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Track-Android-APK
          path: output-apk/Bus-Track.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Bus Track Updated APK (v1.0.4)"
          make_latest: true
          body: |
            ### 🚌 Bus Track Standalone Mobile APK (v1.0.4)
            **Included Fixes & Enhancements:**
            - **Notification Clear Option for ALL Logins**: Full persistent "Clear All" notifications and individual notification dismiss (✕) across Student, Staff/Faculty, Driver, and Admin portals. Cleared notifications persist locally and do not reappear during real-time polling.
            - **Live Sync Parity with Admin Web**: Instant live sync of updated bus routes, bus assignments, stops, driver replacements, faculty leaves, and roster alterations directly from the Admin Web Operations Dashboard to the mobile app within seconds.
            - **Automatic Cloud Registry Heartbeat**: Background auto-sync keeps the standalone generated APK fully matched with cloud data even across network reconnects.
            - **Instant App Launch & Splash Fix**: Resolved app hanging on splash screen / session check with sub-second launch.
            - **Zero-Latency Login**: Instant local credential matching with 1-tap demo access for all campus roles.

            **Installation:** Download `Bus-Track.apk` below and install directly on your Android device.
          files: output-apk/Bus-Track.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-ios-package:
    name: Export iOS App Package (Bus Track)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ztsmxehwjyriyihypppu.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0c214ZWh3anlyaXlpaHlwcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTA4NTMsImV4cCI6MjEwNTQ4Njg1M30.16sn2O8c1HGA6lJTD0TbWYG9lvnHFrhU6-fZXlbmwi4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Shared Types Package
        run: npm run build:shared

      - name: Export Standalone Web & iOS Package
        working-directory: apps/mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ env.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          npx expo export --platform web

      - name: Upload Bus Track iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Track-iOS-Package
          path: apps/mobile/dist/
          retention-days: 30
